# Esquema de cores próprio: assets/css/schemes/cerrado.css
colorScheme = "cerrado"

defaultAppearance = "light"
autoSwitchAppearance = false   # o site é claro por definição; o papel é parte da identidade

enableSearch = true
enableCodeCopy = false          # não é um site técnico

mainSections = ["noticias"]

robots = ""

[header]
layout = "custom"               # usamos layouts/partials/header/custom.html

[footer]
showMenu = true
showCopyright = true
showThemeAttribution = true
showAppearanceSwitcher = false
showScrollToTop = true

[homepage]
layout = "custom"               # usamos layouts/index.html
showRecent = false              # a home traz as notícias por conta própria

[article]
showDate = true
showDateUpdated = false
showAuthor = false
showBreadcrumbs = true
showDraftLabel = true
showEdit = false
showHeadingAnchors = true
showPagination = true
showReadingTime = false
showTableOfContents = false
showTaxonomies = true
showWordCount = false
showComments = false
sharingLinks = ["whatsapp", "facebook", "email"]

[list]
showBreadcrumbs = true
showSummary = true
showTableOfContents = false
groupByYear = false

[sitemap]
excludedKinds = ["taxonomy", "term"]

[taxonomy]
showTermCount = true

description = "Escola Waldorf rural no Cerrado. Educação que nasce da terra vermelha, da arte e da comunidade."
dateFormat = "2 de January de 2006"

[author]
name = "Escola Waldorf Rural Pequizeiro"
image = "img/logo-pequizeiro.png"

[[author.links]]
instagram = "https://instagram.com/SEU_PERFIL"

[[author.links]]
whatsapp = "https://wa.me/55XXXXXXXXXXX"

[[author.links]]
email = "mailto:contato@escolapequizeiro.com.br"

